[config]

[templates.kitty]
input_path = "./templates/kitty-colors.conf"
output_path = "~/.config/kitty/themes/Matugen.conf"
post_hook = "pkill -USR1 kitty"

[templates.quickshell]
input_path = './templates/quickshell.json'
output_path = '~/.local/state/quickshell-config/colors.json'

[templates.bulb]
input_path = './templates/bulb.txt'
output_path = '~/.cache/matugen-bulb'
post_hook = 'wiz hex "$(cat $HOME/.cache/matugen-bulb)" 60'

[templates.neovim]
input_path = "./templates/nvim-colors.json"
output_path = "~/.cache/matugen/nvim-colors.json"
post_hook = "pkill -SIGUSR1 nvim"
